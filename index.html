<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Book Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- SDKs de Firebase (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --memphis-turquoise: #59dcd2;
      --memphis-pink: #ffb1df;
      --memphis-yellow: #ffec64;
      --memphis-navy: #1f3b7d;
      --memphis-white: #ffffff;
      
      --bg: #faf9f6;
      --card-bg: var(--memphis-white);
      --text-main: var(--memphis-navy);
      --text-muted: #66759c;
      --border: var(--text-main);
      
      --font-title: 'Montserrat', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: var(--font-body); 
      background-color: var(--bg); 
      color: var(--text-main); 
      line-height: 1.6;
      background-image: radial-gradient(var(--memphis-turquoise) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(var(--memphis-turquoise) 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; padding: 20px;
    }
    .login-card {
      background: var(--card-bg); padding: 40px; border: 2px solid var(--border);
      box-shadow: 10px 10px 0px var(--memphis-pink);
      border-radius: 20px; text-align: center; width: 100%; max-width: 400px;
    }
    .login-card h1 { font-family: var(--font-title); font-weight: 600; font-size: 2rem; margin-bottom: 5px; color: var(--memphis-navy); text-transform: uppercase; }
    .login-card p { margin-bottom: 20px; font-size: 0.85rem; color: var(--text-muted); }
    .login-card input { width: 100%; margin-bottom: 12px; padding: 14px; border: 2px solid var(--border); outline: none; font-family: var(--font-body); border-radius: 8px;}

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(31, 59, 125, 0.4);
      backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center;
      z-index: 2000; padding: 20px;
    }
    .modal-card {
      background: var(--card-bg); border: 2px solid var(--border);
      box-shadow: 10px 10px 0px var(--memphis-yellow);
      border-radius: 20px; padding: 30px; max-width: 650px; width: 100%;
      max-height: 90vh; overflow-y: auto; position: relative;
    }
    .close-modal-btn {
      position: absolute; top: 16px; right: 16px;
      background: var(--memphis-pink); border: 2px solid var(--border);
      width: 32px; height: 32px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
    }
    .modal-body { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
    .modal-cover { width: 130px; height: 190px; object-fit: cover; border: 2px solid var(--border); flex-shrink: 0; border-radius: 8px; }
    .modal-info { flex: 1; min-width: 200px; }
    .modal-title { font-family: var(--font-title); font-size: 1.5rem; font-weight: 600; line-height: 1.2; margin-bottom: 6px; }
    .modal-author { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); margin-bottom: 12px; }
    .synopsis-text { margin-top: 16px; font-size: 0.88rem; line-height: 1.6; color: var(--text-main); padding-right: 8px; border-top: 2px dashed var(--border); padding-top: 12px; max-height: 180px; overflow-y: auto; }
    
    .kpi-breakdown-list { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
    .kpi-breakdown-item { background: #f8fafc; border: 2px solid var(--border); padding: 14px 18px; border-radius: 12px; box-shadow: 4px 4px 0px var(--memphis-pink); }
    .kpi-breakdown-header { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-title); font-size: 1.1rem; font-weight: 600; color: var(--memphis-navy); }
    .kpi-book-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .kpi-book-tag { font-size: 0.75rem; background: var(--memphis-white); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; font-weight: 500; }

    .edit-controls { margin-top: 20px; padding-top: 16px; border-top: 2px solid var(--border); background: #f8fafc; padding: 16px; border-radius: 12px;}
    .edit-controls h4 { margin-bottom: 12px; font-size: 0.95rem; color: var(--memphis-navy); text-transform: uppercase; letter-spacing: 0.05em;}
    .edit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px;}
    .edit-input, textarea { font-family: var(--font-body); font-size: 0.85rem; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px; background: white;}
    textarea { width: 100%; resize: vertical; min-height: 70px; }
    .btn-update { background: var(--memphis-turquoise); color: var(--memphis-navy); font-weight: 600; padding: 10px 16px; border: 2px solid var(--border); cursor: pointer; text-transform: uppercase; font-size: 0.8rem; border-radius: 8px; transition: all 0.2s; width: 100%; }
    .btn-update:hover { background: var(--memphis-navy); color: white; }

    #app-content { display: none; padding: 40px 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: var(--bg); padding: 30px; border-radius: 20px; border: 2px solid var(--border); box-shadow: 10px 10px 0px var(--memphis-turquoise); }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
    .header-text h1 { font-family: var(--font-title); font-size: 3rem; font-weight: 200; text-transform: uppercase; letter-spacing: 0.1em; color: var(--memphis-navy); }
    .header-text p { font-size: 0.9rem; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; }
    
    .logout-btn { background: var(--memphis-white); border: 2px solid var(--border); padding: 8px 16px; font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; box-shadow: 3px 3px 0px var(--memphis-yellow); transition: all 0.2s; border-radius: 8px;}
    .logout-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--memphis-yellow); }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .kpi-card { background: var(--card-bg); padding: 24px; border: 2px solid var(--border); text-align: center; transition: transform 0.2s; border-radius: 12px;}
    .kpi-card.clickable { cursor: pointer; }
    .kpi-card.clickable:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0px var(--memphis-yellow) !important; }
    .kpi-card:nth-child(1) { box-shadow: 6px 6px 0px var(--memphis-pink); }
    .kpi-card:nth-child(2) { box-shadow: 6px 6px 0px var(--memphis-yellow); }
    .kpi-card:nth-child(3) { box-shadow: 6px 6px 0px var(--memphis-turquoise); }
    .kpi-card:nth-child(4) { box-shadow: 6px 6px 0px var(--memphis-navy); }
    
    .kpi-card p { font-size: 0.8rem; font-weight: 500; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
    .kpi-card span { font-family: var(--font-title); font-size: 2.5rem; font-weight: 300; color: var(--memphis-navy); display: block; }

    .section-title { font-family: var(--font-title); font-size: 2rem; font-weight: 200; text-transform: uppercase; margin-bottom: 24px; color: var(--memphis-navy); }
    .card { background: var(--card-bg); padding: 30px; border: 2px solid var(--border); margin-bottom: 40px; box-shadow: 8px 8px 0px var(--memphis-yellow); border-radius: 16px;}

    .search-box { display: flex; gap: 12px; margin-bottom: 20px; }
    input, select, button { font-family: var(--font-body); font-size: 0.95rem; padding: 14px 18px; border: 2px solid var(--border); outline: none; background: var(--memphis-white); border-radius: 8px;}
    input:focus, select:focus, textarea:focus { background: #f0f4ff; }
    input { flex: 1; }
    
    .btn-primary { background: var(--memphis-pink); color: var(--memphis-navy); font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; border-radius: 8px;}
    .btn-primary:hover { background: var(--memphis-navy); color: var(--memphis-pink); }
    
    .results-dropdown { max-height: 220px; overflow-y: auto; background: var(--card-bg); border: 2px solid var(--border); margin-bottom: 20px; display: none; border-radius: 12px;}
    .result-item { padding: 12px 18px; cursor: pointer; border-bottom: 2px solid var(--border); font-size: 0.9rem; }
    .result-item:hover { background: var(--memphis-yellow); }
    .result-item:last-child { border-bottom: none; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .form-group-full { grid-column: 1 / -1; margin-top: 10px; }

    .controls-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; }
    .tab-btn { background: transparent; border: 2px solid transparent; font-weight: 500; color: var(--text-muted); cursor: pointer; padding: 8px 16px; border-radius: 20px; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; }
    .tab-btn:hover { color: var(--memphis-navy); border-color: var(--border); }
    .tab-btn.active { background: var(--memphis-navy); color: var(--memphis-white); border-color: var(--memphis-navy); }

    .sort-box { display: flex; align-items: center; gap: 8px; }
    .sort-box label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
    .sort-select { font-size: 0.8rem; padding: 6px 12px; border: 2px solid var(--border); border-radius: 8px; background: white; cursor: pointer; }

    details.saga-folder { 
      background: var(--card-bg); 
      border: 2px solid var(--border); 
      border-radius: 12px; 
      padding: 16px; 
      margin-bottom: 20px; 
      box-shadow: 4px 4px 0px var(--memphis-yellow); 
      transition: all 0.2s;
    }
    details.saga-folder summary { 
      font-family: var(--font-title); 
      font-size: 1.1rem; 
      font-weight: 600; 
      letter-spacing: 0.05em;
      color: var(--memphis-navy); 
      text-transform: uppercase; 
      display: flex; 
      justify-content: space-between;
      align-items: center; 
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    details.saga-folder summary::-webkit-details-marker { display: none; }
    .toggle-icon {
      font-size: 0.8rem;
      background: var(--memphis-pink);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
      transition: transform 0.2s ease;
    }
    details.saga-folder[open] .toggle-icon {
      transform: rotate(180deg);
      background: var(--memphis-turquoise);
    }

    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
    .book-card { 
      background: var(--card-bg); padding: 12px; border: 2px solid var(--border); border-radius: 12px;
      display: flex; flex-direction: column; justify-content: space-between; 
      transition: all 0.2s; box-shadow: 4px 4px 0px var(--memphis-turquoise); cursor: pointer;
    }
    .book-card:nth-child(even) { box-shadow: 4px 4px 0px var(--memphis-pink); }
    .book-card:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0px var(--memphis-yellow) !important; }
    
    .cover-img { width: 100%; height: 210px; object-fit: cover; border: 2px solid var(--border); margin-bottom: 10px; background: #eee; border-radius: 8px;}
    
    .book-title { font-family: var(--font-title); font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; line-height: 1.2; color: var(--memphis-navy); }
    .book-author { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 10px; }
    
    .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge { font-size: 0.65rem; font-weight: 600; padding: 4px 8px; border: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; border-radius: 6px;}
    .badge-status-por-leer { background: var(--memphis-yellow); }
    .badge-status-leyendo { background: var(--memphis-pink); }
    .badge-status-completado { background: var(--memphis-turquoise); }
    .badge-genre { background: var(--memphis-white); }
    .badge-saga { background: var(--memphis-pink); color: var(--memphis-navy); }
    
    .book-meta { font-size: 0.75rem; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 8px; margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    
    .delete-btn { background: var(--memphis-navy); color: var(--memphis-white); border: none; font-size: 0.7rem; font-weight: 600; cursor: pointer; padding: 4px 8px; text-transform: uppercase; border-radius: 6px;}
    .delete-btn:hover { background: #ef4444; }

    @media (max-width: 768px) {
      #app-content { padding: 20px 10px; }
      .container { padding: 20px 15px; box-shadow: 6px 6px 0px var(--memphis-turquoise); }
      
      header { flex-direction: column; align-items: flex-start; gap: 15px; text-align: left; }
      .header-text h1 { font-size: 2rem; }
      .logout-btn { width: 100%; text-align: center; }

      .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
      .kpi-card { padding: 15px; }
      .kpi-card span { font-size: 1.8rem; }

      .section-title { font-size: 1.5rem; margin-bottom: 16px; }
      .card { padding: 20px; box-shadow: 5px 5px 0px var(--memphis-yellow); }

      .search-box { flex-direction: column; }
      .search-box button { width: 100%; }

      .form-grid { grid-template-columns: 1fr; }

      .controls-bar { flex-direction: column; align-items: stretch; gap: 15px; }
      .tabs { justify-content: center; }
      .sort-box { justify-content: space-between; }

      .books-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
      .cover-img { height: 180px; }

      .modal-card { padding: 20px; margin: 10px; max-height: 95vh; }
      .modal-body { flex-direction: column; align-items: center; text-align: center; }
      .modal-info { min-width: 100%; }
      .badges { justify-content: center; }
      .edit-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <datalist id="existing-sagas-list"></datalist>

  <div id="login-screen">
    <div class="login-card">
      <h1>Tracker de Lectura</h1>
      <p>Biblioteca en la nube protegida.</p>
      <input type="text" id="login-username" placeholder="Usuario (Ej. Steph)">
      <input type="password" id="login-password" placeholder="Contraseña (Mínimo 6 caracteres)">
      <button class="btn-primary" id="login-btn" style="width: 100%;" onclick="startApp()">Entrar</button>
    </div>
  </div>

  <div id="modal-screen" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <button class="close-modal-btn" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="app-content">
    <div class="container">
      <header>
        <div class="header-text">
          <h1>Biblioteca</h1>
          <p id="user-greeting">Tracker de lecturas</p>
        </div>
        <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
      </header>

      <div class="kpi-grid">
        <div class="kpi-card clickable" onclick="openYearAnalyticsModal()" title="Ver desglose por años"><p>Leídos este Año ↗</p><span id="kpi-year">0</span></div>
        <div class="kpi-card clickable" onclick="openMonthAnalyticsModal()" title="Ver desglose por meses"><p>Leídos este Mes ↗</p><span id="kpi-month">0</span></div>
        <div class="kpi-card"><p>Total Páginas</p><span id="kpi-pages">0</span></div>
        <div class="kpi-card"><p>Género Top</p><span id="kpi-genre" style="font-size: 1.2rem; margin-top: 18px; font-weight: 500; font-family: var(--font-body);">Ninguno</span></div>
      </div>

      <div class="card">
        <h2 class="section-title">Añadir Libro</h2>
        <div class="search-box">
          <input type="text" id="api-search-input" placeholder="Buscar título o autor (ej: God of Fury)...">
          <button class="btn-primary" onclick="searchBook()">Buscar</button>
        </div>
        <div id="results-dropdown" class="results-dropdown"></div>

        <form id="book-form">
          <div class="form-grid">
            <input type="text" id="title" placeholder="Título" required>
            <input type="text" id="author" placeholder="Autor" required>
            <input type="text" id="saga" list="existing-sagas-list" placeholder="Saga / Serie (Opcional)">
            <input type="text" id="genre" placeholder="Género">
            <input type="number" id="pages" placeholder="Páginas">
            <select id="status">
              <option value="Por leer">Por leer</option>
              <option value="Leyendo">Leyendo</option>
              <option value="Completado">Completado</option>
            </select>
            <select id="read-month">
              <option value="">Mes de lectura</option>
              <option value="01">Enero</option><option value="02">Febrero</option>
              <option value="03">Marzo</option><option value="04">Abril</option>
              <option value="05">Mayo</option><option value="06">Junio</option>
              <option value="07">Julio</option><option value="08">Agosto</option>
              <option value="09">Septiembre</option><option value="10">Octubre</option>
              <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
            <input type="number" id="read-year" placeholder="Año (ej. 2026)" min="1900" max="2099">
            <input type="text" id="cover-url" class="form-group-full" placeholder="URL de la Portada (puedes pegar la imagen que quieras)">
            <textarea id="synopsis-input" class="form-group-full" placeholder="Sinopsis (se autocompleta o escríbela tú)"></textarea>
            <button type="submit" class="btn-primary form-group-full">Guardar Libro</button>
          </div>
        </form>
      </div>

      <div class="controls-bar">
        <div class="tabs">
          <button class="tab-btn active" onclick="filterBooks('Todos', this)">Todos</button>
          <button class="tab-btn" onclick="filterBooks('Por leer', this)">Por leer</button>
          <button class="tab-btn" onclick="filterBooks('Leyendo', this)">Leyendo</button>
          <button class="tab-btn" onclick="filterBooks('Completado', this)">Completados</button>
          <button class="tab-btn" onclick="filterBooks('Sagas', this)">📁 Sagas</button>
        </div>

        <div class="sort-box">
          <label for="sort-select">Ordenar:</label>
          <select id="sort-select" class="sort-select" onchange="renderBooks()">
            <option value="newest">Más recientes</option>
            <option value="oldest">Más antiguos</option>
            <option value="title">Por Título (A-Z)</option>
          </select>
        </div>
      </div>

      <div id="books-container"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC2dkjV5ogRsgW8K_qN64hScylVryThA4o",
      authDomain: "mi-book-tracker.firebaseapp.com",
      projectId: "mi-book-tracker",
      storageBucket: "mi-book-tracker.firebasestorage.app",
      messagingSenderId: "766577223514",
      appId: "1:766577223514:web:0c683200494de67f5b3563"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let books = [];
    let currentFilter = 'Todos';
    let currentUser = '';

    const monthNames = {
      "01": "Enero", "02": "Febrero", "03": "Marzo", "04": "Abril",
      "05": "Mayo", "06": "Junio", "07": "Julio", "08": "Agosto",
      "09": "Septiembre", "10": "Octubre", "11": "Noviembre", "12": "Diciembre"
    };

    document.getElementById('api-search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchBook();
      }
    });

    function updateSagaDatalist() {
      const datalist = document.getElementById('existing-sagas-list');
      if (!datalist) return;
      const sagas = [...new Set(books.map(b => b.saga).filter(Boolean))].sort();
      datalist.innerHTML = sagas.map(s => `<option value="${s}">`).join('');
    }

    async function startApp() {
      const usernameInput = document.getElementById('login-username').value.trim().toLowerCase();
      const passwordInput = document.getElementById('login-password').value.trim();
      const loginBtn = document.getElementById('login-btn');

      if (!usernameInput || !passwordInput) {
        alert("Por favor ingresa un usuario y una contraseña.");
        return;
      }

      if (passwordInput.length < 6) {
        alert("La contraseña debe tener al menos 6 caracteres.");
        return;
      }

      loginBtn.innerText = "Conectando...";
      loginBtn.disabled = true;

      const email = `${usernameInput}@mybooktracker.app`;

      try {
        let userCredential;
        try {
          userCredential = await auth.signInWithEmailAndPassword(email, passwordInput);
        } catch (authError) {
          if (authError.code === 'auth/user-not-found' || authError.code === 'auth/invalid-credential') {
            userCredential = await auth.createUserWithEmailAndPassword(email, passwordInput);
            alert(`¡Usuario "${usernameInput}" registrado con éxito!`);
          } else {
            throw authError;
          }
        }

        const user = userCredential.user;
        currentUser = usernameInput;

        const docRef = db.collection('users').doc(user.uid);
        const doc = await docRef.get();

        if (doc.exists) {
          books = doc.data().books || [];
        } else {
          await docRef.set({ books: [] });
          books = [];
        }

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('user-greeting').innerText = `Biblioteca de ${currentUser}`;

        updateSagaDatalist();
        renderBooks();
        updateDashboard();

      } catch (error) {
        alert("Error de autenticación: " + error.message);
      } finally {
        loginBtn.innerText = "Entrar";
        loginBtn.disabled = false;
      }
    }

    function logout() {
      auth.signOut();
      currentUser = '';
      books = [];
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('app-content').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    async function searchBook() {
      const query = document.getElementById('api-search-input').value.trim();
      const dropdown = document.getElementById('results-dropdown');
      if (!query) return;

      dropdown.style.display = 'block';
      dropdown.innerHTML = '<div class="result-item">Buscando en Google Books...</div>';

      try {
        // 1. Buscar PRIMERO en Google Books API directamente
        const gbRes = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=8`);
        const gbData = await gbRes.json();

        dropdown.innerHTML = '';

        if (gbData.items && gbData.items.length > 0) {
          gbData.items.forEach(item => {
            const info = item.volumeInfo;
            const title = info.title || 'Sin título';
            const author = info.authors ? info.authors.join(', ') : 'Autor desconocido';
            
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-item';
            resultDiv.innerText = `${title} — ${author}`;
            resultDiv.onclick = () => selectGoogleBook(info);
            dropdown.appendChild(resultDiv);
          });
          return;
        }

        // 2. Respaldo en Open Library
        const olRes = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=8`);
        const olData = await olRes.json();

        if (olData.docs && olData.docs.length > 0) {
          olData.docs.forEach(book => {
            const title = book.title || 'Sin título';
            const author = book.author_name ? book.author_name[0] : 'Autor desconocido';
            
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-item';
            resultDiv.innerText = `${title} — ${author}`;
            resultDiv.onclick = () => selectOpenLibraryBook(book, title, author);
            dropdown.appendChild(resultDiv);
          });
          return;
        }

        dropdown.innerHTML = '<div class="result-item">No se encontraron resultados. Llénalo manualmente abajo.</div>';

      } catch (e) {
        dropdown.innerHTML = '<div class="result-item">Error al realizar la búsqueda</div>';
      }
    }

    function selectGoogleBook(info) {
      const title = info.title || '';
      const author = info.authors ? info.authors.join(', ') : '';
      
      document.getElementById('title').value = title;
      document.getElementById('author').value = author;

      if (title.includes(':')) {
        document.getElementById('saga').value = title.split(':')[0].trim();
      }

      document.getElementById('pages').value = info.pageCount || '';
      
      let genre = 'Ficción';
      if (info.categories && info.categories.length > 0) {
        let cat = info.categories[0].split('/')[0].trim();
        if (cat.toLowerCase().includes('fiction')) genre = 'Ficción';
        if (cat.toLowerCase().includes('romance')) genre = 'Romance';
        if (cat.toLowerCase().includes('fantasy')) genre = 'Fantasía';
        if (!['Ficción', 'Romance', 'Fantasía'].includes(genre)) genre = cat;
      }
      document.getElementById('genre').value = genre;

      let cover = '';
      if (info.imageLinks) {
        cover = (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '').replace('http:', 'https:');
      }
      document.getElementById('cover-url').value = cover;

      let synopsis = info.description ? info.description.replace(/<[^>]*>?/gm, '') : 'Sinopsis no disponible.';
      document.getElementById('synopsis-input').value = synopsis;

      document.getElementById('results-dropdown').style.display = 'none';
      document.getElementById('api-search-input').value = '';
    }

    function selectOpenLibraryBook(book, title, author) {
      document.getElementById('title').value = title;
      document.getElementById('author').value = author;
      document.getElementById('pages').value = book.number_of_pages_median || book.number_of_pages || '';
      document.getElementById('genre').value = 'Ficción';
      document.getElementById('cover-url').value = book.cover_i ? `https://covers.openlibrary.org/b/id/${book.cover_i}-L.jpg` : '';
      document.getElementById('synopsis-input').value = 'Sinopsis no disponible.';

      document.getElementById('results-dropdown').style.display = 'none';
      document.getElementById('api-search-input').value = '';
    }

    document.getElementById('book-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newBook = {
        id: Date.now(),
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        saga: document.getElementById('saga').value.trim(),
        genre: document.getElementById('genre').value || 'Sin género',
        pages: parseInt(document.getElementById('pages').value) || 0,
        status: document.getElementById('status').value,
        month: document.getElementById('read-month').value,
        year: document.getElementById('read-year').value,
        cover: document.getElementById('cover-url').value || 'https://via.placeholder.com/300x400/eeeeee/1f3b7d?text=Sin+Portada',
        synopsis: document.getElementById('synopsis-input').value || 'Sinopsis no disponible.'
      };

      books.push(newBook);
      saveAndRender();
      document.getElementById('book-form').reset();
      document.getElementById('cover-url').value = '';
      document.getElementById('synopsis-input').value = '';
    });

    function deleteBook(id, e) {
      if (e) e.stopPropagation();
      books = books.filter(b => b.id !== id);
      saveAndRender();
    }

    function openModal(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;

      const modalContent = document.getElementById('modal-content');
      const statusSlug = book.status.toLowerCase().replace(/\s+/g, '-');
      const dateText = (book.month && book.year) ? `${book.month}/${book.year}` : '-';

      modalContent.innerHTML = `
        <div class="modal-body">
          <img src="${book.cover}" class="modal-cover" alt="Portada" onerror="this.src='https://via.placeholder.com/300x400/eeeeee/1f3b7d?text=Sin+Portada'">
          <div class="modal-info">
            <h2 class="modal-title">${book.title}</h2>
            <p class="modal-author">${book.author}</p>
            <div class="badges">
              <span class="badge badge-status-${statusSlug}">${book.status}</span>
              <span class="badge badge-genre">${book.genre}</span>
              ${book.saga ? `<span class="badge badge-saga">📁 ${book.saga}</span>` : ''}
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 10px;">
              ${book.pages ? book.pages + ' páginas' : 'Páginas no especificadas'} ${dateText !== '-' ? '• Leído en: ' + dateText : ''}
            </p>
          </div>
        </div>
        
        <div class="synopsis-text">
          <strong>Sinopsis:</strong>
          <p style="margin-top: 6px;">${book.synopsis}</p>
        </div>

        <div class="edit-controls">
          <h4>Editar Detalles y Progreso</h4>
          <div class="edit-grid">
            <div>
              <label style="font-size:0.75rem; font-weight:600;">Estado:</label>
              <select id="edit-status-${book.id}" class="edit-input" style="width:100%;" onchange="toggleDateFields(${book.id})">
                <option value="Por leer" ${book.status === 'Por leer' ? 'selected' : ''}>Por leer</option>
                <option value="Leyendo" ${book.status === 'Leyendo' ? 'selected' : ''}>Leyendo</option>
                <option value="Completado" ${book.status === 'Completado' ? 'selected' : ''}>Completado</option>
              </select>
            </div>

            <div>
              <label style="font-size:0.75rem; font-weight:600;">Saga / Serie:</label>
              <input type="text" id="edit-saga-${book.id}" list="existing-sagas-list" class="edit-input" style="width:100%;" value="${book.saga || ''}" placeholder="Ej: Legacy of Gods">
            </div>

            <div>
              <label style="font-size:0.75rem; font-weight:600;">Páginas:</label>
              <input type="number" id="edit-pages-${book.id}" class="edit-input" style="width:100%;" value="${book.pages || ''}" placeholder="Páginas">
            </div>
          </div>

          <div style="margin-bottom:12px;">
            <label style="font-size:0.75rem; font-weight:600;">URL Portada:</label>
            <input type="text" id="edit-cover-${book.id}" class="edit-input" style="width:100%;" value="${book.cover || ''}">
          </div>

          <div style="margin-bottom:12px;">
            <label style="font-size:0.75rem; font-weight:600;">Sinopsis:</label>
            <textarea id="edit-synopsis-${book.id}">${book.synopsis || ''}</textarea>
          </div>

          <div id="edit-date-fields-${book.id}" style="display: ${book.status === 'Completado' ? 'flex' : 'none'}; gap: 10px; margin-bottom:12px;">
            <select id="edit-month-${book.id}" class="edit-input" style="flex:1;">
              <option value="">Mes de lectura</option>
              <option value="01" ${book.month === '01' ? 'selected' : ''}>Enero</option>
              <option value="02" ${book.month === '02' ? 'selected' : ''}>Febrero</option>
              <option value="03" ${book.month === '03' ? 'selected' : ''}>Marzo</option>
              <option value="04" ${book.month === '04' ? 'selected' : ''}>Abril</option>
              <option value="05" ${book.month === '05' ? 'selected' : ''}>Mayo</option>
              <option value="06" ${book.month === '06' ? 'selected' : ''}>Junio</option>
              <option value="07" ${book.month === '07' ? 'selected' : ''}>Julio</option>
              <option value="08" ${book.month === '08' ? 'selected' : ''}>Agosto</option>
              <option value="09" ${book.month === '09' ? 'selected' : ''}>Septiembre</option>
              <option value="10" ${book.month === '10' ? 'selected' : ''}>Octubre</option>
              <option value="11" ${book.month === '11' ? 'selected' : ''}>Noviembre</option>
              <option value="12" ${book.month === '12' ? 'selected' : ''}>Diciembre</option>
            </select>
            <input type="number" id="edit-year-${book.id}" class="edit-input" style="width: 100px;" placeholder="Año" value="${book.year || new Date().getFullYear()}">
          </div>

          <button class="btn-update" onclick="updateBookStatus(${book.id})">Guardar cambios</button>
        </div>
      `;
      document.getElementById('modal-screen').style.display = 'flex';
    }

    function openYearAnalyticsModal() {
      const completed = books.filter(b => b.status === 'Completado');
      const yearMap = {};

      completed.forEach(b => {
        const y = b.year || 'Sin año asignado';
        if (!yearMap[y]) yearMap[y] = [];
        yearMap[y].push(b);
      });

      const sortedYears = Object.keys(yearMap).sort((a, b) => b.localeCompare(a));
      const modalContent = document.getElementById('modal-content');

      let html = `<h2 class="section-title">Histórico por Año</h2>`;
      
      if (sortedYears.length === 0) {
        html += `<p style="color:var(--text-muted);">Aún no has registrado libros completados con fecha.</p>`;
      } else {
        html += `<div class="kpi-breakdown-list">`;
        sortedYears.forEach(year => {
          const count = yearMap[year].length;
          const bookTitles = yearMap[year].map(b => `<span class="kpi-book-tag">📖 ${b.title}</span>`).join('');
          html += `
            <div class="kpi-breakdown-item">
              <div class="kpi-breakdown-header">
                <span>Año ${year}</span>
                <span>${count} ${count === 1 ? 'libro' : 'libros'}</span>
              </div>
              <div class="kpi-book-tags">${bookTitles}</div>
            </div>
          `;
        });
        html += `</div>`;
      }

      modalContent.innerHTML = html;
      document.getElementById('modal-screen').style.display = 'flex';
    }

    function openMonthAnalyticsModal() {
      const completed = books.filter(b => b.status === 'Completado');
      const monthMap = {};

      completed.forEach(b => {
        const key = (b.year && b.month) ? `${b.year}-${b.month}` : 'Sin fecha asignada';
        if (!monthMap[key]) monthMap[key] = [];
        monthMap[key].push(b);
      });

      const sortedKeys = Object.keys(monthMap).sort((a, b) => b.localeCompare(a));
      const modalContent = document.getElementById('modal-content');

      let html = `<h2 class="section-title">Histórico por Mes</h2>`;
      
      if (sortedKeys.length === 0) {
        html += `<p style="color:var(--text-muted);">Aún no has registrado libros completados con fecha.</p>`;
      } else {
        html += `<div class="kpi-breakdown-list">`;
        sortedKeys.forEach(key => {
          const count = monthMap[key].length;
          let label = key;
          if (key.includes('-')) {
            const [y, m] = key.split('-');
            label = `${monthNames[m] || m} ${y}`;
          }
          const bookTitles = monthMap[key].map(b => `<span class="kpi-book-tag">📖 ${b.title}</span>`).join('');
          html += `
            <div class="kpi-breakdown-item">
              <div class="kpi-breakdown-header">
                <span>${label}</span>
                <span>${count} ${count === 1 ? 'libro' : 'libros'}</span>
              </div>
              <div class="kpi-book-tags">${bookTitles}</div>
            </div>
          `;
        });
        html += `</div>`;
      }

      modalContent.innerHTML = html;
      document.getElementById('modal-screen').style.display = 'flex';
    }

    function toggleDateFields(id) {
      const status = document.getElementById(`edit-status-${id}`).value;
      const dateFields = document.getElementById(`edit-date-fields-${id}`);
      dateFields.style.display = status === 'Completado' ? 'flex' : 'none';
    }

    function updateBookStatus(id) {
      const bookIndex = books.findIndex(b => b.id === id);
      if (bookIndex !== -1) {
        const newStatus = document.getElementById(`edit-status-${id}`).value;
        books[bookIndex].status = newStatus;
        books[bookIndex].saga = document.getElementById(`edit-saga-${id}`).value.trim();
        books[bookIndex].pages = parseInt(document.getElementById(`edit-pages-${id}`).value) || 0;
        books[bookIndex].cover = document.getElementById(`edit-cover-${id}`).value.trim() || 'https://via.placeholder.com/300x400/eeeeee/1f3b7d?text=Sin+Portada';
        books[bookIndex].synopsis = document.getElementById(`edit-synopsis-${id}`).value.trim() || 'Sinopsis no disponible.';
        
        if (newStatus === 'Completado') {
          books[bookIndex].month = document.getElementById(`edit-month-${id}`).value;
          books[bookIndex].year = document.getElementById(`edit-year-${id}`).value;
        } else {
          books[bookIndex].month = "";
          books[bookIndex].year = "";
        }

        saveAndRender();
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById('modal-screen').style.display = 'none';
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'modal-screen') closeModal();
    }

    function filterBooks(status, btn) {
      currentFilter = status;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBooks();
    }

    function saveAndRender() {
      updateSagaDatalist();
      renderBooks();
      updateDashboard();

      const user = auth.currentUser;
      if (user) {
        db.collection('users').doc(user.uid).set({
          books: books
        }).catch(err => console.error("Error al guardar:", err));
      }
    }

    function updateDashboard() {
      const currentYear = new Date().getFullYear().toString();
      const currentMonth = String(new Date().getMonth() + 1).padStart(2, '0');

      const completed = books.filter(b => b.status === 'Completado');
      
      const yearCount = completed.filter(b => b.year === currentYear).length;
      const monthCount = completed.filter(b => b.year === currentYear && b.month === currentMonth).length;
      const totalPages = completed.reduce((acc, b) => acc + (b.pages || 0), 0);

      const genres = {};
      completed.forEach(b => { if(b.genre && b.genre !== 'Sin género') genres[b.genre] = (genres[b.genre] || 0) + 1; });
      const topGenre = Object.keys(genres).length > 0 ? Object.keys(genres).reduce((a, b) => genres[a] > genres[b] ? a : b) : 'Ninguno';

      document.getElementById('kpi-year').innerText = yearCount;
      document.getElementById('kpi-month').innerText = monthCount;
      document.getElementById('kpi-pages').innerText = totalPages.toLocaleString();
      document.getElementById('kpi-genre').innerText = topGenre;
    }

    function getSortedBooks(list) {
      const sortType = document.getElementById('sort-select').value;
      return [...list].sort((a, b) => {
        if (sortType === 'newest') {
          const dateA = (a.year && a.month) ? `${a.year}${a.month}` : `${a.id}`;
          const dateB = (b.year && b.month) ? `${b.year}${b.month}` : `${b.id}`;
          return dateB.localeCompare(dateA);
        } else if (sortType === 'oldest') {
          const dateA = (a.year && a.month) ? `${a.year}${a.month}` : `${a.id}`;
          const dateB = (b.year && b.month) ? `${b.year}${b.month}` : `${b.id}`;
          return dateA.localeCompare(dateB);
        } else if (sortType === 'title') {
          return a.title.localeCompare(b.title);
        }
      });
    }

    function createBookCardHtml(book) {
      const statusSlug = book.status.toLowerCase().replace(/\s+/g, '-');
      const dateText = (book.month && book.year) ? `${book.month}/${book.year}` : '-';

      return `
        <div class="book-card" onclick="openModal(${book.id})">
          <div>
            <img src="${book.cover}" class="cover-img" alt="Portada" onerror="this.src='https://via.placeholder.com/300x400/eeeeee/1f3b7d?text=Sin+Portada'">
            <div class="badges">
              <span class="badge badge-status-${statusSlug}">${book.status}</span>
              <span class="badge badge-genre">${book.genre}</span>
            </div>
            <h3 class="book-title">${book.title}</h3>
            <p class="book-author">${book.author}</p>
          </div>
          <div class="book-meta">
            <span>${dateText !== '-' ? 'Leído: ' + dateText : ''}</span>
            <button class="delete-btn" onclick="deleteBook(${book.id}, event)">Borrar</button>
          </div>
        </div>
      `;
    }

    function renderBooks() {
      const container = document.getElementById('books-container');
      container.innerHTML = '';

      let filtered = currentFilter === 'Todos' ? books : books.filter(b => b.status === currentFilter);

      if (currentFilter === 'Sagas') {
        const sagasMap = {};
        const sinSaga = [];

        books.forEach(book => {
          if (book.saga) {
            if (!sagasMap[book.saga]) sagasMap[book.saga] = [];
            sagasMap[book.saga].push(book);
          } else {
            sinSaga.push(book);
          }
        });

        Object.keys(sagasMap).forEach(sagaName => {
          const folderDiv = document.createElement('details');
          folderDiv.className = 'saga-folder';
          folderDiv.open = true;
          
          const sortedSagaBooks = getSortedBooks(sagasMap[sagaName]);
          
          folderDiv.innerHTML = `
            <summary>
              <span>📁 Saga: ${sagaName} (${sagasMap[sagaName].length})</span>
              <span class="toggle-icon">▼</span>
            </summary>
            <div class="books-grid" style="margin-top: 14px;">
              ${sortedSagaBooks.map(b => createBookCardHtml(b)).join('')}
            </div>
          `;
          container.appendChild(folderDiv);
        });

        if (sinSaga.length > 0) {
          const folderDiv = document.createElement('details');
          folderDiv.className = 'saga-folder';
          folderDiv.open = true;
          
          const sortedSinSaga = getSortedBooks(sinSaga);
          folderDiv.innerHTML = `
            <summary>
              <span>📚 Libros Independientes (${sinSaga.length})</span>
              <span class="toggle-icon">▼</span>
            </summary>
            <div class="books-grid" style="margin-top: 14px;">
              ${sortedSinSaga.map(b => createBookCardHtml(b)).join('')}
            </div>
          `;
          container.appendChild(folderDiv);
        }
        return;
      }

      const sortedBooks = getSortedBooks(filtered);
      const gridDiv = document.createElement('div');
      gridDiv.className = 'books-grid';
      gridDiv.innerHTML = sortedBooks.map(b => createBookCardHtml(b)).join('');
      container.appendChild(gridDiv);
    }
  </script>
</body>
</html>
