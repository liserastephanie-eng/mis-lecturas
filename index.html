<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Book Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --memphis-turquoise: #59dcd2;
      --memphis-pink: #ffb1df;
      --memphis-yellow: #ffec64;
      --memphis-navy: #1f3b7d;
      --memphis-white: #ffffff;
      
      --bg: #faf9f6;
      --card-bg: var(--memphis-white);
      --text-main: var(--memphis-navy);
      --text-muted: #66759c;
      --border: var(--text-main);
      
      --font-title: 'Montserrat', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: var(--font-body); 
      background-color: var(--bg); 
      color: var(--text-main); 
      line-height: 1.6;
      background-image: radial-gradient(var(--memphis-turquoise) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Pantalla de Login */
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(var(--memphis-turquoise) 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; padding: 20px;
    }
    .login-card {
      background: var(--card-bg); padding: 40px; border: 2px solid var(--border);
      box-shadow: 10px 10px 0px var(--memphis-pink);
      border-radius: 20px; text-align: center; width: 100%; max-width: 400px;
    }
    .login-card h1 { font-family: var(--font-title); font-weight: 600; font-size: 2rem; margin-bottom: 20px; color: var(--memphis-navy); text-transform: uppercase; }
    .login-card input { width: 100%; margin-bottom: 16px; }

    /* Modal de Sinopsis */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(31, 59, 125, 0.4);
      backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center;
      z-index: 2000; padding: 20px;
    }
    .modal-card {
      background: var(--card-bg); border: 2px solid var(--border);
      box-shadow: 10px 10px 0px var(--memphis-yellow);
      border-radius: 20px; padding: 30px; max-width: 600px; width: 100%;
      max-height: 85vh; overflow-y: auto; position: relative;
    }
    .close-modal-btn {
      position: absolute; top: 16px; right: 16px;
      background: var(--memphis-pink); border: 2px solid var(--border);
      width: 32px; height: 32px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-body { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
    .modal-cover { width: 140px; height: 200px; object-fit: cover; border: 2px solid var(--border); flex-shrink: 0; }
    .modal-info { flex: 1; min-width: 200px; }
    .modal-title { font-family: var(--font-title); font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin-bottom: 6px; }
    .modal-author { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); margin-bottom: 12px; }
    .synopsis-text { margin-top: 16px; font-size: 0.9rem; line-height: 1.6; color: var(--text-main); max-height: 250px; overflow-y: auto; padding-right: 8px; border-top: 2px dashed var(--border); padding-top: 12px; }

    /* Contenedor Principal */
    #app-content { display: none; padding: 40px 20px; }
    
    .container { max-width: 1000px; margin: 0 auto; background: var(--bg); padding: 30px; border-radius: 20px; border: 2px solid var(--border); box-shadow: 10px 10px 0px var(--memphis-turquoise); }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
    .header-text h1 { font-family: var(--font-title); font-size: 3rem; font-weight: 200; text-transform: uppercase; letter-spacing: 0.1em; color: var(--memphis-navy); }
    .header-text p { font-size: 0.9rem; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; }
    
    .logout-btn { background: var(--memphis-white); border: 2px solid var(--border); padding: 8px 16px; font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; box-shadow: 3px 3px 0px var(--memphis-yellow); transition: all 0.2s; }
    .logout-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--memphis-yellow); }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .kpi-card { background: var(--card-bg); padding: 24px; border: 2px solid var(--border); text-align: center; transition: transform 0.2s; }
    .kpi-card:nth-child(1) { box-shadow: 6px 6px 0px var(--memphis-pink); }
    .kpi-card:nth-child(2) { box-shadow: 6px 6px 0px var(--memphis-yellow); }
    .kpi-card:nth-child(3) { box-shadow: 6px 6px 0px var(--memphis-turquoise); }
    .kpi-card:nth-child(4) { box-shadow: 6px 6px 0px var(--memphis-navy); }
    .kpi-card:hover { transform: translate(-2px, -2px); }
    .kpi-card p { font-size: 0.8rem; font-weight: 500; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
    .kpi-card span { font-family: var(--font-title); font-size: 2.5rem; font-weight: 300; color: var(--memphis-navy); display: block; }

    .section-title { font-family: var(--font-title); font-size: 2rem; font-weight: 200; text-transform: uppercase; margin-bottom: 24px; color: var(--memphis-navy); }
    .card { background: var(--card-bg); padding: 30px; border: 2px solid var(--border); margin-bottom: 40px; box-shadow: 8px 8px 0px var(--memphis-yellow); }

    .search-box { display: flex; gap: 12px; margin-bottom: 20px; }
    input, select, button { font-family: var(--font-body); font-size: 0.95rem; padding: 14px 18px; border: 2px solid var(--border); outline: none; background: var(--memphis-white); }
    input:focus, select:focus { background: #f0f4ff; }
    input { flex: 1; }
    
    .btn-primary { background: var(--memphis-pink); color: var(--memphis-navy); font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
    .btn-primary:hover { background: var(--memphis-navy); color: var(--memphis-pink); }
    
    .results-dropdown { max-height: 220px; overflow-y: auto; background: var(--card-bg); border: 2px solid var(--border); margin-bottom: 20px; display: none; }
    .result-item { padding: 12px 18px; cursor: pointer; border-bottom: 2px solid var(--border); font-size: 0.9rem; }
    .result-item:hover { background: var(--memphis-yellow); }
    .result-item:last-child { border-bottom: none; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .form-group-full { grid-column: 1 / -1; margin-top: 10px; }

    .tabs { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
    .tab-btn { background: transparent; border: 2px solid transparent; font-weight: 500; color: var(--text-muted); cursor: pointer; padding: 8px 20px; border-radius: 20px; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; }
    .tab-btn:hover { color: var(--memphis-navy); border-color: var(--border); }
    .tab-btn.active { background: var(--memphis-navy); color: var(--memphis-white); border-color: var(--memphis-navy); }

    /* TARJETAS MÁS PEQUEÑAS Y COMPACTAS */
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
    .book-card { 
      background: var(--card-bg); padding: 12px; border: 2px solid var(--border); 
      display: flex; flex-direction: column; justify-content: space-between; 
      transition: all 0.2s; box-shadow: 4px 4px 0px var(--memphis-turquoise); cursor: pointer;
    }
    .book-card:nth-child(even) { box-shadow: 4px 4px 0px var(--memphis-pink); }
    .book-card:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0px var(--memphis-yellow) !important; }
    
    .cover-img { width: 100%; height: 210px; object-fit: cover; border: 2px solid var(--border); margin-bottom: 10px; background: #eee; }
    
    .book-title { font-family: var(--font-title); font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; line-height: 1.2; color: var(--memphis-navy); }
    .book-author { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 10px; }
    
    .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge { font-size: 0.65rem; font-weight: 600; padding: 2px 8px; border: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; }
    .badge-status-por-leer { background: var(--memphis-yellow); }
    .badge-status-leyendo { background: var(--memphis-pink); }
    .badge-status-completado { background: var(--memphis-turquoise); }
    .badge-genre { background: var(--memphis-white); }
    
    .book-meta { font-size: 0.75rem; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 8px; margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    
    .delete-btn { background: var(--memphis-navy); color: var(--memphis-white); border: none; font-size: 0.7rem; font-weight: 600; cursor: pointer; padding: 4px 8px; text-transform: uppercase; }
    .delete-btn:hover { background: #ef4444; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <h1>Bienvenido</h1>
      <p style="margin-bottom: 20px; font-size: 0.9rem; color: var(--text-muted);">Ingresa tu usuario para abrir tu biblioteca.</p>
      <input type="text" id="login-username" placeholder="Usuario (Ej. Steph)">
      <button class="btn-primary" style="width: 100%;" onclick="startApp()">Entrar</button>
    </div>
  </div>

  <!-- MODAL SINOPSIS -->
  <div id="modal-screen" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <button class="close-modal-btn" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="app-content">
    <div class="container">
      <header>
        <div class="header-text">
          <h1>Biblioteca</h1>
          <p id="user-greeting">Tracker de lecturas</p>
        </div>
        <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
      </header>

      <div class="kpi-grid">
        <div class="kpi-card"><p>Leídos este Año</p><span id="kpi-year">0</span></div>
        <div class="kpi-card"><p>Leídos este Mes</p><span id="kpi-month">0</span></div>
        <div class="kpi-card"><p>Total Páginas</p><span id="kpi-pages">0</span></div>
        <div class="kpi-card"><p>Género Top</p><span id="kpi-genre" style="font-size: 1.2rem; margin-top: 18px; font-weight: 500; font-family: var(--font-body);">Ninguno</span></div>
      </div>

      <div class="card">
        <h2 class="section-title">Añadir Libro</h2>
        <div class="search-box">
          <input type="text" id="api-search-input" placeholder="Buscar título o autor (ej: God of Pain)...">
          <button class="btn-primary" onclick="searchBook()">Buscar</button>
        </div>
        <div id="results-dropdown" class="results-dropdown"></div>

        <form id="book-form">
          <div class="form-grid">
            <input type="text" id="title" placeholder="Título" required>
            <input type="text" id="author" placeholder="Autor" required>
            <input type="text" id="genre" placeholder="Género">
            <input type="number" id="pages" placeholder="Páginas">
            <select id="status">
              <option value="Por leer">Por leer</option>
              <option value="Leyendo">Leyendo</option>
              <option value="Completado">Completado</option>
            </select>
            <select id="read-month">
              <option value="">Mes de lectura</option>
              <option value="01">Enero</option><option value="02">Febrero</option>
              <option value="03">Marzo</option><option value="04">Abril</option>
              <option value="05">Mayo</option><option value="06">Junio</option>
              <option value="07">Julio</option><option value="08">Agosto</option>
              <option value="09">Septiembre</option><option value="10">Octubre</option>
              <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
            <input type="number" id="read-year" placeholder="Año (ej. 2026)" min="1900" max="2099">
            <input type="hidden" id="cover-url">
            <input type="hidden" id="synopsis-hidden">
            <button type="submit" class="btn-primary form-group-full">Guardar Libro</button>
          </div>
        </form>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="filterBooks('Todos', this)">Todos</button>
        <button class="tab-btn" onclick="filterBooks('Por leer', this)">Por leer</button>
        <button class="tab-btn" onclick="filterBooks('Leyendo', this)">Leyendo</button>
        <button class="tab-btn" onclick="filterBooks('Completado', this)">Completados</button>
      </div>

      <div class="books-grid" id="books-grid"></div>
    </div>
  </div>

  <script>
    let books = [];
    let currentFilter = 'Todos';
    let currentUser = '';

    document.getElementById('api-search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchBook();
      }
    });

    function startApp() {
      const usernameInput = document.getElementById('login-username').value.trim();
      if (!usernameInput) {
        alert("Por favor ingresa un nombre de usuario");
        return;
      }
      
      currentUser = usernameInput;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
      document.getElementById('user-greeting').innerText = `Tracker de lecturas de ${currentUser}`;
      
      const savedData = localStorage.getItem(`bookTracker_${currentUser}`);
      books = savedData ? JSON.parse(savedData) : [];
      
      renderBooks();
      updateDashboard();
    }

    function logout() {
      currentUser = '';
      books = [];
      document.getElementById('login-username').value = '';
      document.getElementById('app-content').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    async function searchBook() {
      const query = document.getElementById('api-search-input').value.trim();
      const dropdown = document.getElementById('results-dropdown');
      if (!query) return;

      dropdown.style.display = 'block';
      dropdown.innerHTML = '<div class="result-item">Buscando libros...</div>';

      try {
        const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=10`);
        const data = await response.json();
        dropdown.innerHTML = '';

        if (!data.docs || data.docs.length === 0) {
          dropdown.innerHTML = '<div class="result-item">No se encontraron resultados. Intenta otro término.</div>';
          return;
        }

        data.docs.forEach(book => {
          const title = book.title || 'Sin título';
          const author = book.author_name ? book.author_name.join(', ') : 'Autor desconocido';
          
          const resultDiv = document.createElement('div');
          resultDiv.className = 'result-item';
          resultDiv.innerText = `${title} — ${author}`;
          resultDiv.onclick = () => selectBook(book);
          dropdown.appendChild(resultDiv);
        });
      } catch (e) {
        dropdown.innerHTML = '<div class="result-item">Error al buscar información</div>';
      }
    }

    async function selectBook(book) {
      document.getElementById('title').value = book.title || '';
      document.getElementById('author').value = book.author_name ? book.author_name[0] : '';
      
      let genre = 'Romance';
      if (book.subject && book.subject.length > 0) {
        const cleanSubject = book.subject.find(s => 
          !s.toLowerCase().includes('protected') && 
          !s.toLowerCase().includes('accessible') &&
          !s.toLowerCase().includes('borrow')
        ) || book.subject[0];
        genre = cleanSubject.split(',')[0].trim();
      }
      document.getElementById('genre').value = genre;

      let coverUrl = 'https://via.placeholder.com/300x400/eeeeee/1f3b7d?text=Sin+Portada';
      if (book.cover_i) {
        coverUrl = `https://covers.openlibrary.org/b/id/${book.cover_i}-L.jpg`;
      }
      document.getElementById('cover-url').value = coverUrl;

      // Páginas
      let pages = book.number_of_pages_median || book.number_of_pages || '';
      if (!pages && book.edition_key && book.edition_key.length > 0) {
        try {
          const edKey = book.edition_key[0];
          const res = await fetch(`https://openlibrary.org/api/books?bibkeys=OLID:${edKey}&format=json&jscmd=data`);
          const edData = await res.json();
          if (edData[`OLID:${edKey}`] && edData[`OLID:${edKey}`].number_of_pages) {
            pages = edData[`OLID:${edKey}`].number_of_pages;
          }
        } catch(e) {}
      }
      document.getElementById('pages').value = pages;

      // Obtener Sinopsis de la obra
      let synopsis = 'Sin sinopsis disponible.';
      if (book.key) {
        try {
          const workRes = await fetch(`https://openlibrary.org${book.key}.json`);
          const workData = await workRes.json();
          if (workData.description) {
            synopsis = typeof workData.description === 'string' 
              ? workData.description 
              : (workData.description.value || synopsis);
          }
        } catch(e) {}
      }
      document.getElementById('synopsis-hidden').value = synopsis;

      document.getElementById('results-dropdown').style.display = 'none';
      document.getElementById('api-search-input').value = '';
    }

    document.getElementById('book-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newBook = {
        id: Date.now(),
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        genre: document.getElementById('genre').value || 'Sin género',
        pages: parseInt(document.getElementById('pages').value) || 0,
        status: document.getElementById('status').value,
        month: document.getElementById('read-month').value,
        year: document.getElementById('read-year').value,
        cover: document.getElementById('cover-url').value || 'https://via.placeholder.com/300x400/eeeeee/1f3b7d?text=Sin+Portada',
        synopsis: document.getElementById('synopsis-hidden').value || 'Sin sinopsis disponible.'
      };

      books.push(newBook);
      saveAndRender();
      document.getElementById('book-form').reset();
      document.getElementById('cover-url').value = '';
      document.getElementById('synopsis-hidden').value = '';
    });

    function deleteBook(id, e) {
      if (e) e.stopPropagation();
      books = books.filter(b => b.id !== id);
      saveAndRender();
    }

    // Modal de Detalle / Sinopsis
    function openModal(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;

      const modalContent = document.getElementById('modal-content');
      const statusSlug = book.status.toLowerCase().replace(/\s+/g, '-');
      const dateText = (book.month && book.year) ? `${book.month}/${book.year}` : '-';

      modalContent.innerHTML = `
        <div class="modal-body">
          <img src="${book.cover}" class="modal-cover" alt="Portada" onerror="this.src='https://via.placeholder.com/300x400/eeeeee/1f3b7d?text=Sin+Portada'">
          <div class="modal-info">
            <h2 class="modal-title">${book.title}</h2>
            <p class="modal-author">${book.author}</p>
            <div class="badges">
              <span class="badge badge-status-${statusSlug}">${book.status}</span>
              <span class="badge badge-genre">${book.genre}</span>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 10px;">
              ${book.pages ? book.pages + ' páginas' : ''} ${dateText !== '-' ? '• Leído en: ' + dateText : ''}
            </p>
          </div>
        </div>
        <div class="synopsis-text">
          <strong>Sinopsis:</strong>
          <p style="margin-top: 6px;">${book.synopsis}</p>
        </div>
      `;
      document.getElementById('modal-screen').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-screen').style.display = 'none';
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'modal-screen') closeModal();
    }

    function filterBooks(status, btn) {
      currentFilter = status;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBooks();
    }

    function saveAndRender() {
      localStorage.setItem(`bookTracker_${currentUser}`, JSON.stringify(books));
      renderBooks();
      updateDashboard();
    }

    function updateDashboard() {
      const currentYear = new Date().getFullYear().toString();
      const currentMonth = String(new Date().getMonth() + 1).padStart(2, '0');

      const completed = books.filter(b => b.status === 'Completado');
      
      const yearCount = completed.filter(b => b.year === currentYear).length;
      const monthCount = completed.filter(b => b.year === currentYear && b.month === currentMonth).length;
      const totalPages = completed.reduce((acc, b) => acc + (b.pages || 0), 0);

      const genres = {};
      completed.forEach(b => { if(b.genre && b.genre !== 'Sin género') genres[b.genre] = (genres[b.genre] || 0) + 1; });
      const topGenre = Object.keys(genres).length > 0 ? Object.keys(genres).reduce((a, b) => genres[a] > genres[b] ? a : b) : 'Ninguno';

      document.getElementById('kpi-year').innerText = yearCount;
      document.getElementById('kpi-month').innerText = monthCount;
      document.getElementById('kpi-pages').innerText = totalPages.toLocaleString();
      document.getElementById('kpi-genre').innerText = topGenre;
    }

    function renderBooks() {
      const grid = document.getElementById('books-grid');
      grid.innerHTML = '';

      const filtered = currentFilter === 'Todos' ? books : books.filter(b => b.status === currentFilter);

      filtered.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.onclick = () => openModal(book.id);
        
        const statusSlug = book.status.toLowerCase().replace(/\s+/g, '-');
        const dateText = (book.month && book.year) ? `${book.month}/${book.year}` : '-';

        card.innerHTML = `
          <div>
            <img src="${book.cover}" class="cover-img" alt="Portada" onerror="this.src='https://via.placeholder.com/300x400/eeeeee/1f3b7d?text=Sin+Portada'">
            <div class="badges">
              <span class="badge badge-status-${statusSlug}">${book.status}</span>
              <span class="badge badge-genre">${book.genre}</span>
            </div>
            <h3 class="book-title">${book.title}</h3>
            <p class="book-author">${book.author}</p>
          </div>
          <div class="book-meta">
            <span>${dateText !== '-' ? 'Leído: ' + dateText : ''}</span>
            <button class="delete-btn" onclick="deleteBook(${book.id}, event)">Borrar</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
